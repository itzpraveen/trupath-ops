# Render Blueprint: one web service + one Postgres, both in Singapore (closest region to India).
# Deploy: push this repo to GitHub, then Render dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: trupath-ops
    runtime: node
    region: singapore
    plan: starter
    buildCommand: (corepack enable && corepack prepare pnpm@10.13.1 --activate) || npm install -g pnpm@10.13.1; pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: npm run db:migrate && npm run db:seed
    # start:render applies migrations and the idempotent seed before starting, so the schema is always current
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: trupath-db
          property: connectionString
      - key: TZ
        value: Asia/Kolkata
      - key: APP_URL
        sync: false
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_OWNER_NAME
        value: Owner
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_SYNC_MINUTES
        value: "15"
      - key: CRON_SECRET
        generateValue: true
      # Encrypts Shopify tokens and client secrets stored in the database. Keep it stable once set.
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: trupath-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
