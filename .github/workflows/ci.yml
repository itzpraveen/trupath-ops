name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trupath
          POSTGRES_PASSWORD: trupath
          POSTGRES_DB: trupath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trupath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://trupath:trupath@127.0.0.1:5432/trupath
      APP_URL: http://localhost:3100
      APP_ENCRYPTION_KEY: ci-only-not-a-secret
      SEED_OWNER_EMAIL: owner@trupaths.in
      SEED_OWNER_PASSWORD: change-me-now
      SHOPIFY_SYNC_MINUTES: "0"
      COOKIE_SECURE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:setup
      - name: Browser test
        run: |
          PORT=3100 pnpm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/health > /dev/null && break; sleep 1; done
          CHROME_PATH=/usr/bin/google-chrome pnpm test:e2e ./e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: |
            e2e-shots
            server.log
          if-no-files-found: ignore
